name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml runs the same checks before it publishes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: "Windows host (Python ${{ matrix.python }}: tests, lint, dependency audit)"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: host/requirements.txt
      - name: Install host dependencies
        run: python -m pip install -r host/requirements.txt ruff==0.17.2 pip-audit==2.10.1 coverage==7.17.0  # pinned: a new lint rule must not fail an unchanged commit
      - name: Lint (syntax errors, undefined names, unused imports, bug-prone patterns)
        run: python -m ruff check host tests tools plugins hardware --select E9,F,B --exclude host/.venv
      - name: Unit, editor, protocol and reliability tests (host coverage must stay at 73 %)
        run: |
          python -m coverage run --source=host --omit="host/.venv/*,host/tessera_terminal.py" -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit 1 }  # PowerShell keeps going; only the last command sets the step's result
          python -m coverage report --fail-under=73
      - name: Editor syntax check (node --check reads only its first file, so one call per file)
        run: Get-ChildItem host/editor/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Terminal self-check
        run: python host/tessera_terminal.py --check
      - name: Dependency audit
        run: python -m pip_audit -r host/requirements.txt

  host-linux:
    name: "Linux host (Python ${{ matrix.python }}: tests that are not Windows-only)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: host/requirements.txt
      - name: Install host dependencies
        run: python -m pip install -r host/requirements.txt
      - name: Install a virtual display (the tray tests start an X11 icon)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Platform-independent and Linux tests (Windows tests skip themselves; see tests/platform_marks.py)
        run: xvfb-run -a python -m unittest discover -s tests -v

  host-lock:
    name: "Windows host from the lock file (Python ${{ matrix.python }}, clean venv)"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']  # oldest supported and newest: the lock must install on both
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install host/requirements.lock with its hashes, as Tessera.cmd does
        run: |
          python -m venv "$env:RUNNER_TEMP/venv"
          & "$env:RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --require-hashes -r host/requirements.lock
      - name: Unit, editor, protocol and reliability tests
        run: '& "$env:RUNNER_TEMP/venv/Scripts/python.exe" -m unittest discover -s tests'

  host-lock-linux:
    name: "Linux host from the lock file (Python 3.12, clean venv)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'  # the version the lock is made with, and the oldest Tessera.sh accepts
      - name: Install host/requirements.lock with its hashes, as the first start does
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes -r host/requirements.lock

  firmware-analysis:
    name: Firmware static analysis (cppcheck)
    runs-on: ubuntu-latest  # not the ESP-IDF container: apt inside it could not reach the Ubuntu archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
      - name: Check the firmware sources (the generated fonts are left out)
        run: >
          cppcheck --enable=warning,portability --inline-suppr --std=c++17 --error-exitcode=1 --quiet
          -I main -I main/ui main/main.cpp main/deck_model.c main/deck_images.cpp main/time_service.c main/ui/ui.cpp

  firmware:
    name: Firmware build and native LVGL tests
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build/idf6 build
          ls -l build/idf6/tessera.bin
      - name: Package firmware
        shell: bash
        run: python3 tools/package_firmware.py build/idf6 dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tessera-firmware
          path: dist/
      - name: Native LVGL render and model tests
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cmake -S tests/native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
          build/native/test_ui build/native/out
      - name: Image cache benchmark
        shell: bash
        run: |
          python3 -m venv /tmp/bench
          /tmp/bench/bin/pip install --quiet pyserial==3.5 psutil==7.2.2 Pillow==13.0.0  # the versions in host/requirements.lock
          /tmp/bench/bin/python tests/cache_bench.py --exe build/native/cache_bench --check
          /tmp/bench/bin/python tests/cache_bench.py --exe build/native/cache_bench --old-firmware --check

  firmware-boards:
    name: Firmware build for ${{ matrix.board }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:  # the boards with a board file; the GUITION P4 build is the firmware job above
        include:
          - {board: tessera-s3-ws7, target: esp32s3, defaults: boards/tessera-s3-ws7.defaults}
          - {board: tessera-s3-8048s070, target: esp32s3, defaults: boards/tessera-s3-8048s070.defaults}
          - {board: tessera-s3-crowpanel7, target: esp32s3, defaults: boards/tessera-s3-crowpanel7.defaults}
          - {board: tessera-p4-crowpanel7, target: esp32p4, defaults: boards/crowpanel-p4-7.defaults}
          - {board: tessera-p4-v3, target: esp32p4, defaults: boards/tessera-p4-v3.defaults}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # The v3.x GUITION build starts from the tested v1.x sdkconfig; only the revision options come from its board file
          if [ "${{ matrix.board }}" = tessera-p4-v3 ]; then python3 tools/v3_sdkconfig.py sdkconfig build/tessera-p4-v3/sdkconfig; fi
          idf.py -B build/${{ matrix.board }} -DSDKCONFIG=build/${{ matrix.board }}/sdkconfig -DIDF_TARGET=${{ matrix.target }} \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;${{ matrix.defaults }}" build
          ls -l build/${{ matrix.board }}/tessera.bin
      - name: Package firmware
        shell: bash
        run: python3 tools/package_firmware.py build/${{ matrix.board }} dist --board ${{ matrix.board }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tessera-firmware-${{ matrix.board }}
          path: dist/
