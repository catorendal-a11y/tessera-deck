name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: "Windows host (Python ${{ matrix.python }}: tests, lint, dependency audit)"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: host/requirements.txt
      - name: Install host dependencies
        run: python -m pip install -r host/requirements.txt ruff==0.17.2 pip-audit==2.10.1 coverage==7.17.0  # pinned: a new lint rule must not fail an unchanged commit
      - name: Lint (syntax errors, undefined names, unused imports, bug-prone patterns)
        run: python -m ruff check host tests tools plugins --select E9,F,B --exclude host/.venv
      - name: Unit, editor, protocol and reliability tests (host coverage must stay at 73 %)
        run: |
          python -m coverage run --source=host --omit="host/.venv/*,host/tessera_terminal.py" -m unittest discover -s tests -v
          python -m coverage report --fail-under=73
      - name: Terminal self-check
        run: python host/tessera_terminal.py --check
      - name: Dependency audit
        run: python -m pip_audit -r host/requirements.txt

  host-lock:
    name: "Windows host from the lock file (Python ${{ matrix.python }}, clean venv)"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']  # oldest supported and newest: the lock must install on both
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install host/requirements.lock with its hashes, as Tessera.cmd does
        run: |
          python -m venv "$env:RUNNER_TEMP/venv"
          & "$env:RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --require-hashes -r host/requirements.lock
      - name: Unit, editor, protocol and reliability tests
        run: '& "$env:RUNNER_TEMP/venv/Scripts/python.exe" -m unittest discover -s tests'

  firmware-analysis:
    name: Firmware static analysis (cppcheck)
    runs-on: ubuntu-latest  # not the ESP-IDF container: apt inside it could not reach the Ubuntu archive
    steps:
      - uses: actions/checkout@v6
      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
      - name: Check the firmware sources (the generated fonts are left out)
        run: >
          cppcheck --enable=warning,portability --inline-suppr --std=c++17 --error-exitcode=1 --quiet
          -I main -I main/ui main/main.cpp main/deck_model.c main/deck_images.cpp main/time_service.c main/ui/ui.cpp

  firmware:
    name: Firmware build and native LVGL tests
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v6
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build/idf6 build
          ls -l build/idf6/tessera.bin
      - name: Package firmware
        shell: bash
        run: python3 tools/package_firmware.py build/idf6 dist
      - uses: actions/upload-artifact@v6
        with:
          name: tessera-firmware
          path: dist/
      - name: Native LVGL render and model tests
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cmake -S tests/native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
          build/native/test_ui build/native/out
