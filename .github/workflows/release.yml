name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # a dry run from the Actions page: builds and packages everything, publishes nothing

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  # Seconds, and first: a wrong tag stops the release before anything is built.
  tag:
    name: Check the tag and the changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; keep the token out of .git/config, where any later step could read it
      - name: Check the tag matches VERSION
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION"; exit 1; }
      - name: Check CHANGELOG.md has a section for VERSION
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          heading="## $(tr -d '\r\n' < VERSION)"
          tr -d '\r' < CHANGELOG.md | grep -qxF "${heading}" || { echo "CHANGELOG.md has no '${heading}' heading: rename '## Unreleased'"; exit 1; }

  # The firmware packages are the ones the CI jobs above built and packaged, one job per board side by side.
  # Building all six again here, one after the other, made a release take 25 minutes longer.
  release:
    name: Build the release files
    needs: [ci, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; keep the token out of .git/config, where any later step could read it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tessera-firmware*
          path: dist
          merge-multiple: true
      - name: Package firmware and host
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          for board in "" -tessera-s3-ws7 -tessera-s3-8048s070 -tessera-s3-crowpanel7 -tessera-p4-crowpanel7 -tessera-p4-v3; do
            test -s "dist/tessera-firmware${board}-${version}.zip" || { echo "dist/tessera-firmware${board}-${version}.zip is missing"; ls -l dist; exit 1; }
          done
          test "$(ls dist/tessera-firmware-*.zip | wc -l)" = 6 || { echo "expected 6 firmware packages"; ls -l dist; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=zip --prefix="tessera-${GITHUB_REF_NAME}/" -o "dist/tessera-host-${GITHUB_REF_NAME}.zip" HEAD
          python3 -c "import glob,os,sys,zipfile; z=zipfile.ZipFile(sys.argv[1],'a'); [z.write(f,'tessera-'+sys.argv[2]+'/firmware/'+os.path.basename(f)) for f in sorted(glob.glob('dist/tessera-firmware-*.zip'))]; z.close()" "dist/tessera-host-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"
          # The same file under a name without the version: releases/latest/download/tessera-host.zip is then one
          # address for every release, which a command in the README can use.
          cp "dist/tessera-host-${GITHUB_REF_NAME}.zip" dist/tessera-host.zip
          (cd dist && rm -f *.sha256 && sha256sum *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The host tests on the Windows runner, from the hashed lock file the release zip installs from.
  host-tests:
    name: Host tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; keep the token out of .git/config, where any later step could read it
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the host dependencies from the lock file
        run: python -m pip install --require-hashes -r host/requirements.lock
      - name: Unit, editor, protocol and reliability tests
        run: python -m unittest discover -s tests

  # A job of its own on the plain runner, where gh is already installed. Installing it with apt inside the ESP-IDF
  # container failed the 0.6.1 release twice when the Ubuntu archive could not be reached.
  publish:
    name: Publish the release
    if: github.ref_type == 'tag'  # a dry run stops after the files are built
    needs: [release, host-tests, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # signs the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; keep the token out of .git/config, where any later step could read it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          awk -v heading="## ${version}" '{sub(/\r$/, "")} $0 == heading {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          grep -q . "${RUNNER_TEMP}/notes.md" || { echo "The CHANGELOG.md section for ${version} is empty"; exit 1; }
      # Lets anyone check a download came from this workflow: gh attestation verify <file> --repo <owner>/tessera-deck
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "Tessera ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
