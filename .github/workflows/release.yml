name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build the release files
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; keep the token out of .git/config, where any later step could read it
      - name: Check the tag matches VERSION
        shell: bash
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION"; exit 1; }
      - name: Check CHANGELOG.md has a section for VERSION
        shell: bash
        run: |
          heading="## $(tr -d '\r\n' < VERSION)"
          tr -d '\r' < CHANGELOG.md | grep -qxF "${heading}" || { echo "CHANGELOG.md has no '${heading}' heading: rename '## Unreleased'"; exit 1; }
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build/idf6 build
      - name: Native LVGL render and model tests
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cmake -S tests/native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
          build/native/test_ui build/native/out
      - name: Package firmware and host
        shell: bash
        run: |
          python3 tools/package_firmware.py build/idf6 dist
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=zip --prefix="tessera-${GITHUB_REF_NAME}/" -o "dist/tessera-host-${GITHUB_REF_NAME}.zip" HEAD
          python3 -c "import glob,os,sys,zipfile; z=zipfile.ZipFile(sys.argv[1],'a'); f=glob.glob('dist/tessera-firmware-*.zip')[0]; z.write(f,'tessera-'+sys.argv[2]+'/firmware/'+os.path.basename(f)); z.close()" "dist/tessera-host-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"
          (cd dist && rm -f *.sha256 && sha256sum *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The host tests on the Windows runner, from the hashed lock file the release zip installs from.
  host-tests:
    name: Host tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; keep the token out of .git/config, where any later step could read it
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the host dependencies from the lock file
        run: python -m pip install --require-hashes -r host/requirements.lock
      - name: Unit, editor, protocol and reliability tests
        run: python -m unittest discover -s tests

  # A job of its own on the plain runner, where gh is already installed. Installing it with apt inside the ESP-IDF
  # container failed the 0.6.1 release twice when the Ubuntu archive could not be reached.
  publish:
    name: Publish the release
    needs: [release, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # signs the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no job here pushes; keep the token out of .git/config, where any later step could read it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          awk -v heading="## ${version}" '{sub(/\r$/, "")} $0 == heading {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          grep -q . "${RUNNER_TEMP}/notes.md" || { echo "The CHANGELOG.md section for ${version} is empty"; exit 1; }
      # Lets anyone check a download came from this workflow: gh attestation verify <file> --repo <owner>/tessera-deck
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "Tessera ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
