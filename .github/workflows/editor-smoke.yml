name: Editor smoke test

on:
  push:
    branches: [main]
    paths: ['host/**', 'tests/editor_smoke/**', '.github/workflows/editor-smoke.yml']
  pull_request:
    paths: ['host/**', 'tests/editor_smoke/**', '.github/workflows/editor-smoke.yml']

permissions:
  contents: read

concurrency:
  group: editor-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Editor in a real browser (deck, dialogs, focus, axe)
    runs-on: windows-latest  # the host is a Windows program
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: host/requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install host dependencies from the hashed lock file, as Tessera.cmd does
        run: python -m pip install --require-hashes -r host/requirements.lock
      - name: Install Playwright and axe (exact versions from package.json)
        working-directory: tests/editor_smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Start the editor and check it
        working-directory: tests/editor_smoke
        env:
          PYTHON: python
          EDITOR_PORT: '8765'
        run: node smoke.mjs
